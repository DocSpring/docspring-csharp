          description: "Combined fields only: the text placed between the values when\
            \ `combined_field_type` is `separator`. Empty values are skipped. Defaults\
            \ to a space. Shared by every field with the same `name`."
          type: string
        combined_field_format:
          description: "Combined fields only: the text for `combined_field_type` `format`,\
            \ where `$0`, `$1` and so on are replaced with the values of `combined_field_names`\
            \ in order, such as `Full name: $0, Occupation: $1`. Shared by every field\
            \ with the same `name`."
          type: string
        integer:
          description: "Number fields only: the value must be a whole number. Shared\
            \ by every field with the same `name`."
          type: boolean
        minimum:
          description: "Number fields only: the smallest value allowed. Shared by\
            \ every field with the same `name`."
          type: number
          x-nullable: true
        maximum:
          description: "Number fields only: the largest value allowed. Shared by every\
            \ field with the same `name`."
          type: number
          x-nullable: true
        exclusive_minimum:
          description: "Number fields only: the value must be greater than `minimum`,\
            \ not equal to it. Shared by every field with the same `name`."
          type: boolean
        exclusive_maximum:
          description: "Number fields only: the value must be less than `maximum`,\
            \ not equal to it. Shared by every field with the same `name`."
          type: boolean
        include_time:
          description: "Date fields only: the value is a date and time (`YYYY-MM-DDThh:mm:ss.fffZ`)\
            \ instead of a date (`YYYY-MM-DD`), and it prints with the template's\
            \ date-time format unless `date_time_format` is set. Shared by every field\
            \ with the same `name`."
          type: boolean
          x-nullable: true
        signature_allow_draw:
          description: "Signature and initials fields only: lets signers draw their\
            \ signature on forms and in data requests. Shared by every field with\
            \ the same `name`."
          type: boolean
        signature_allow_type:
          description: "Signature and initials fields only: lets signers type their\
            \ name and choose a script font instead of drawing, on forms and in data\
            \ requests. Shared by every field with the same `name`."
          type: boolean
        barcode_symbology:
          allOf:
          - $ref: "#/components/schemas/BarcodeSymbology"
          description: "Barcode fields only: the barcode format, which the value must\
            \ match. `code_128` and `pdf417` take any ASCII text; `code_39` and `code_93`\
            \ take capital letters, digits, spaces and `- . $ / + %`; `code_25` takes\
            \ digits; `ean_13` takes 12 digits, `ean_8` 7 digits and `upc_a` 11 digits\
            \ (the check digit is added). Shared by every field with the same `name`."
        hidden:
          description: "Leaves the field off the PDF. It stays in the template's data\
            \ schema (marked `x-hidden`) and on forms, so other fields, such as combined\
            \ fields, can use its value. A hidden static check mark or shape isn't\
            \ printed."
          type: boolean
        x:
          description: "The distance from the page's left edge to the field's left\
            \ edge. Positions and sizes are in units where every page is 2480 wide:\
            \ one unit is the page's width in points divided by 2480 (about 0.247\
            \ points on a US Letter page)."
          type: number
        "y":
          description: "The distance from the top edge of the field's `page` down\
            \ to the field's top edge, in the units of `x`. A page is 2480 times its\
            \ height divided by its width units tall: about 3209 for US Letter and\
            \ 3508 for A4."
          type: number
        width:
          description: "The field's width, in the units of `x`. A check mark is sized\
            \ to the field's width."
          type: number
        height:
          description: "The field's height, in the units of `x`. The template editor\
            \ keeps check marks, QR codes, and square and circle shapes square, with\
            \ `height` equal to `width`."
          type: number
        rotation:
          description: "Rotates the field clockwise by this many degrees, from -360\
            \ to 360 (negative turns it counterclockwise)."
          type: number
        display_type:
          allOf:
          - $ref: "#/components/schemas/FieldDisplayType"
          description: "How the value appears on the PDF: `text`, `check` (a check\
            \ mark), `shape`, `qrcode`, `barcode`, or `image` (image, signature and\
            \ initials fields). Check marks and shapes print only when the value meets\
            \ the field's `condition`, and the field's `type` limits which display\
            \ types it can use."
        opacity:
          description: "The opacity of the field's content and background, from 0\
            \ (invisible) to 1. QR codes and barcodes always print at full opacity."
          type: number
        date_time_format:
          description: "Date fields only: how the date prints, as a strftime format\
            \ such as `%m/%d/%Y`, or a calculation such as `@years_since`, `@years_until`\
            \ or `@diff_years` (also months, weeks, days, hours, minutes and seconds),\
            \ counted to when the PDF is generated. Empty uses the template's date\
            \ format, or its date-time format with `include_time`."
          type: string
          x-nullable: true
        typeface:
          allOf:
          - $ref: "#/components/schemas/Typeface"
          description: "Text display only: the font, one of `Helvetica`, `Arial`,\
            \ `Calibri`, `Open Sans`, `Roboto`, `Lato`, `Poppins`, `Public Sans`,\
            \ `Questrial`, `Times New Roman`, `Dancing Script`, `Lovtony Script`,\
            \ or the monospace `Courier`, `Inconsolata`, `Menlo`, `Roboto Mono` and\
            \ `Ubuntu Mono`. Empty uses the template's default typeface."
          x-nullable: true
        font_size:
          description: "Text display only: the font size in points. Empty uses the\
            \ template's default font size."
          type: integer
          x-nullable: true
        character_spacing:
          description: "Text display only: extra space between characters, in points.\
            \ Empty uses the template's default."
          type: number
        bold:
          description: "Text display only: prints the text in bold."
          type: boolean
        uppercase:
          description: "Text display only: prints the text in capital letters."
          type: boolean
        strikethrough:
          description: "Text display only: draws a line through the text."
          type: boolean
        keep_leading_spaces:
          description: "Text display only: keeps the spaces at the start of the text\
            \ and of each line, so text can be lined up with spaces."
          type: boolean
        overflow:
          allOf:
          - $ref: "#/components/schemas/TextOverflow"
          description: "Text display only: what happens to text that doesn't fit the\
            \ field. `shrink_to_fit` makes the font smaller, down to 5 points; `truncate`\
            \ cuts the text off and returns the rest in the submission's `truncated_text`."
        multiline:
          description: "Text display only: wraps the text over as many lines as fit\
            \ in the field's height instead of printing one line, and forms show a\
            \ multi-line input."
          type: boolean
        multiline_lines:
          description: "Text display only, with `multiline`: spreads the text over\
            \ exactly this many evenly spaced lines in the field's height (up to 300),\
            \ to line up with lines printed on the form. Empty uses the font's normal\
            \ line spacing."
          type: integer
          x-nullable: true
        min_length:
          description: "Text display only: the fewest characters the value can have,\
            \ added to the template's data schema. Not used for date, address, country\
            \ or number fields, or fields with an `option_list`."
          type: number
        max_length:
          description: "Text display only: the most characters the value can have,\
            \ added to the template's data schema; it also limits an `editable` field.\
            \ Not used for date, address, country or number fields, or fields with\
            \ an `option_list`."
          type: integer
          x-nullable: true
        auto_calculate_max_length:
          description: "Text display only, with a monospace `typeface` (`Courier`,\
            \ `Inconsolata`, `Menlo`, `Roboto Mono` or `Ubuntu Mono`): adds the number\
            \ of characters that fit in the field to the template's data schema as\
            \ its maximum length."
          type: boolean
        color:
          description: "Text display only: the text color, as a hex code such as `444444`.\
            \ Empty uses the template's default text color."
          type: string
          x-pattern-message: "must be a 6-digit hex color without #, like FF0000"
          x-nullable: true
        color_field_name:
          description: "Text display only: the name of a data field whose value, a\
            \ hex code such as `FF0000`, sets the text color for each submission.\
            \ That field is added to the template's data schema, with `color` as its\
            \ default."
          type: string
          x-nullable: true
        color_field_required:
          description: "Makes the `color_field_name` field required. When it isn't\
            \ required and a submission leaves it out, `color` is used."
          type: boolean
        background_color:
          description: "Text and check display only: a color that fills the field's\
            \ area behind its content, as a hex code, to cover what the page shows\
            \ there. Check fields print it even when unchecked; text fields print\
            \ it only when they have a value."
          type: string
          x-pattern-message: "must be a 6-digit hex color without #, like FF0000"
          x-nullable: true
        background_color_field_name:
          description: "Text and check display only: the name of a data field whose\
            \ value, a hex code, sets the background color for each submission. That\
            \ field is added to the template's data schema, with `background_color`\
            \ as its default."
          type: string
          x-nullable: true
        background_color_field_required:
          description: "Makes the `background_color_field_name` field required. When\
            \ it isn't required and a submission leaves it out, `background_color`\
            \ is used."
          type: boolean
        alignment:
          allOf:
          - $ref: "#/components/schemas/TextAlignment"
          description: "Text display only: how the text is aligned across the field:\
            \ `left`, `center`, `right` or `justify` (both edges of every line of\
            \ multiline text except the last of each paragraph)."
        v_alignment:
          allOf:
          - $ref: "#/components/schemas/TextVerticalAlignment"
          description: "Text display only: how the text is aligned vertically in the\
            \ field: `bottom`, `center` or `top`."
        comb:
          description: "Text display only: splits the field into `comb_number_of_cells`\
            \ boxes of equal width and prints one character, centered, in each."
          type: boolean
        comb_number_of_cells:
          description: "With `comb`: how many boxes the field has. The value's maximum\
            \ length in the template's data schema is this plus `comb_value_offset`."
          type: integer
        comb_value_offset:
          description: "With `comb`: the position, from 0, of the first character\
            \ of the value that this field prints. For an SSN printed in boxes of\
            \ 3, 2 and 4 digits, three fields named `ssn` use offsets 0, 3 and 5."
          type: integer
        shape_type:
          allOf:
          - $ref: "#/components/schemas/ShapeType"
          description: "Shape display only: `square`, `rectangle`, `circle`, `ellipse`,\
            \ `triangle` or `polygon`. A square or circle uses the smaller of `width`\
            \ and `height`."
        shape_sides:
          description: "Shape display only, with `shape_type` `polygon`: the number\
            \ of sides, 3 to 12."
          type: integer
        shape_border_width:
          description: "Shape display only: the width of the shape's border, in points."
          type: integer
        shape_border_color:
          description: "Shape display only: the shape's border color, as a hex code.\
            \ Null draws no border."
          type: string
          x-pattern-message: "must be a 6-digit hex color without #, like FF0000"
        shape_border_color_field_name:
          description: "Shape display only: the name of a data field whose value,\
            \ a hex code, sets the border color for each submission. That field is\
            \ added to the template's data schema, with `shape_border_color` as its\
            \ default."
          type: string
          x-nullable: true
        shape_border_color_field_required:
          description: "Makes the `shape_border_color_field_name` field required.\
            \ When it isn't required and a submission leaves it out, `shape_border_color`\
            \ is used."
          type: boolean
        shape_fill_color:
          description: "Shape display only: the color that fills the shape, as a hex\
            \ code. Null leaves it unfilled."
          type: string
          x-pattern-message: "must be a 6-digit hex color without #, like FF0000"
          x-nullable: true
        shape_fill_color_field_name:
          description: "Shape display only: the name of a data field whose value,\
            \ a hex code, sets the fill color for each submission. That field is added\
            \ to the template's data schema, with `shape_fill_color` as its default."
          type: string
          x-nullable: true
        shape_fill_color_field_required:
          description: "Makes the `shape_fill_color_field_name` field required. When\
            \ it isn't required and a submission leaves it out, `shape_fill_color`\
            \ is used."
          type: boolean
        check_character:
          allOf:
          - $ref: "#/components/schemas/CheckCharacter"
          description: "Check display only: the character printed, as an HTML entity:\
            \ `&#10003;` (✓), `&#10004;` (✔, the default), `&#10006;` (✖), `&#10007;`\
            \ (✗) or `&#10008;` (✘)."
          x-enum-varnames:
          - CHECK
          - HEAVY_CHECK
          - MULTIPLICATION_X
          - BALLOT_X
          - HEAVY_BALLOT_X
        check_color:
          description: "Check display only: the check mark's color, as a hex code.\
            \ Empty uses the template's default check color."
          type: string
          x-pattern-message: "must be a 6-digit hex color without #, like FF0000"
          x-nullable: true
        check_color_field_name:
          description: "Check display only: the name of a data field whose value,\
            \ a hex code, sets the check mark's color for each submission. That field\
            \ is added to the template's data schema, with `check_color` as its default."
          type: string
          x-nullable: true
        check_color_field_required:
          description: "Makes the `check_color_field_name` field required. When it\
            \ isn't required and a submission leaves it out, `check_color` is used."
          type: boolean
        qrcode_color:
          description: "QR code display only: the QR code's color, as a hex code,\
            \ printed on a white background. Empty prints it in black."
          type: string
          x-pattern-message: "must be a 6-digit hex color without #, like FF0000"
          x-nullable: true
        qrcode_color_field_name:
          description: "QR code display only: the name of a data field whose value,\
            \ a hex code, sets the QR code's color for each submission. That field\
            \ is added to the template's data schema, with `qrcode_color` as its default."
          type: string
          x-nullable: true
        qrcode_color_field_required:
          description: "Makes the `qrcode_color_field_name` field required. When it\
            \ isn't required and a submission leaves it out, `qrcode_color` is used."
          type: boolean
        true_text:
          description: "Boolean fields with text display: the text printed when the\
            \ value is `true`. Empty uses the template's `true_text`; when neither\
            \ is set, nothing prints."
          type: string
          x-nullable: true
        false_text:
          description: "Boolean fields with text display: the text printed when the\
            \ value is `false`. Empty uses the template's `false_text`; when neither\
            \ is set, nothing prints."
          type: string
          x-nullable: true
        condition:
          description: "Check and shape display only: the value a string or number\
            \ field's value is compared with, by `string_condition_type` or `number_condition_type`,\
            \ to decide whether the check mark or shape prints. Boolean fields print\
            \ when `true` (see `invert_boolean_condition`), and other types print\
            \ when they have a value."
          type: string
          x-nullable: true
        string_condition_type:
          allOf:
          - $ref: "#/components/schemas/StringConditionType"
          description: "String fields with check or shape display: how the value is\
            \ compared with `condition`: `equals`, `contains`, `starts_with`, `ends_with`,\
            \ or `regex`, where `condition` is a regular expression the value must\
            \ match."
        number_condition_type:
          allOf:
          - $ref: "#/components/schemas/NumberConditionType"
          description: "Number fields with check or shape display: how the value is\
            \ compared with `condition`: `equals`, `gt` (greater than), `gte` (greater\
            \ than or equal to), `lt` (less than), `lte` (less than or equal to),\
            \ or `range`, between `number_condition_range_min` and `number_condition_range_max`."
        number_condition_range_min:
          description: "With `number_condition_type` `range`: the lower end of the\
            \ range, included unless `number_condition_range_exclusive_min` is set."
          type: number
          x-nullable: true
        number_condition_range_max:
          description: "With `number_condition_type` `range`: the upper end of the\
            \ range, included unless `number_condition_range_exclusive_max` is set."
          type: number
          x-nullable: true
        number_condition_range_exclusive_min:
          description: "With `number_condition_type` `range`: leaves `number_condition_range_min`\
            \ itself out of the range."
          type: boolean
        number_condition_range_exclusive_max:
          description: "With `number_condition_type` `range`: leaves `number_condition_range_max`\
            \ itself out of the range."
          type: boolean
        invert_boolean_condition:
          description: "Boolean fields with check or shape display: prints the check\
            \ mark or shape when the value is `false` or missing, instead of `true`."
          type: boolean
        currency:
          description: "Number fields only: forms show a currency input, and the template's\
            \ data schema gives the field `format: currency`. It doesn't change how\
            \ the number prints."
          type: boolean
        decimal_places:
          description: "Number fields with text display: prints the number with this\
            \ many decimal places, from 0 (rounds to a whole number) to 99. Empty\
            \ prints the number as it was sent."
          type: integer
          x-nullable: true
        image_scale_type:
          allOf:
          - $ref: "#/components/schemas/ImageScaleType"
          description: "Image fields only: how the image is resized to the field.\
            \ `fit` keeps its proportions and fits it inside the field, which can\
            \ leave empty space; `fill` keeps its proportions and crops it to fill\
            \ the field; `stretch` stretches it to the field's size. Signatures and\
            \ initials always fit."
        image_gravity:
          allOf:
          - $ref: "#/components/schemas/ImageGravity"
          description: "Image, signature and initials fields: where the image sits\
            \ in the field with `fit`, or which part is kept with `fill`: `NorthWest`\
            \ (top left), `North`, `NorthEast`, `West`, `Center`, `East`, `SouthWest`,\
            \ `South` or `SouthEast` (bottom right). It also aligns typed signatures,\
            \ and isn't used with `stretch`."
        dependencies:
          allOf:
          - $ref: "#/components/schemas/FieldDependencyInput"
          description: "The field's own conditional logic rule: when other fields'\
            \ values meet its conditions, the field is shown, made required, or both.\
            \ Null when it has none. The template's rules (`field_dependencies`) can\
            \ apply to the field too. Shared by every field with the same `name`."
          x-nullable: true
        id:
          description: "The field's ID. Required when updating a field. When adding\
            \ one, leave it out for the next free ID."
          type: integer
      title: FieldInput
    CreateCombinedPdfRequest:
      additionalProperties: {}
      description: "The PDFs to merge, and the combined PDF's settings."
      example:
        source_pdfs:
        - type: submission
          id: id
        - type: submission
          id: id
        metadata:
          key: ""
        password: password
        delete_custom_files: true
        expires_in: 0
      properties:
        source_pdfs:
          description: "The PDFs to merge, in order."
          items:
            $ref: "#/components/schemas/CombinedPdfSourceInput"
          type: array
          default: null
        metadata:
          additionalProperties: true
          description: "Your own data about the combined PDF, such as an ID from your\
            \ app. Its `pdf_filename` key names the PDF's file (`files.pdf.filename`,\
            \ and its download): a `.pdf` ending is removed, each run of characters\
            \ other than letters, digits, `-`, `_` and `.` becomes one `_`, and the\
            \ first 128 characters are kept, then `.pdf` is added. Without it, the\
            \ file is named after the combined PDF's ID (`com_1234567890abcdef01.pdf`)."
          type: object
        password:
          description: A password that the PDF needs to be opened with. It's never
            returned; `has_password` says if it's set.
          type: string
          writeOnly: true
        delete_custom_files:
          description: Delete the custom files in `source_pdfs` once the combined
            PDF has been generated (they're kept if it fails). Other combined PDFs
            can't use them after that. A test API token can't delete custom files.
          type: boolean
        expires_in:
          description: "Seconds after the PDF is generated until the combined PDF\
            \ expires, up to 10 years (315360000). One that fails is kept for at least\
            \ 48 hours. Without it, the combined PDF is kept until you delete it."
          type: integer
          writeOnly: true
      required:
      - source_pdfs
      title: CreateCombinedPdfRequest
    CreateCustomFileFromUploadRequest:
      additionalProperties: false
      description: The uploaded file to create the custom file from.
      example:
        cache_id: cache_id
      properties:
        cache_id:
          description: "The `fields.key` from GET /uploads/presign, after you upload\
            \ the file to its URL."
          type: string
      required:
      - cache_id
      title: CreateCustomFileFromUploadRequest
    CreateFolderRequest:
      additionalProperties: false
      description: The folder to create.
      example:
        name: name
        parent_folder_id: parent_folder_id
      properties:
        name:
          description: "The folder's name. It can't contain `/`, and is unique within\
            \ its parent folder."
          type: string
          x-pattern-message: can't contain a slash (/)
        parent_folder_id:
          description: The ID of the folder this folder is in. Null for a folder at
            the root.
          type: string
          x-nullable: true
      required:
      - name
      title: CreateFolderRequest
    MoveFolderRequest:
      additionalProperties: false
      description: Where to move the folder.
      example:
        parent_folder_id: parent_folder_id
      properties:
        parent_folder_id:
          description: The ID of the folder this folder is in. Null for a folder at
            the root.
          type: string
          x-nullable: true
      required:
      - parent_folder_id
      title: MoveFolderRequest
    RenameFolderRequest:
      additionalProperties: false
      description: The folder's new name.
      example:
        name: name
      properties:
        name:
          description: "The folder's name. It can't contain `/`, and is unique within\
            \ its parent folder."
          type: string
          x-pattern-message: can't contain a slash (/)
      required:
      - name
      title: RenameFolderRequest
    UpdateSignatureRequestRequest:
      additionalProperties: {}
      description: The settings to change. Properties left out keep their values.
      example:
        metadata:
          key: ""
        auth_type: ""
        auth_second_factor_type: ""
        auth_provider: auth_provider
        auth_session_started_at: 2000-01-23T04:56:07.000+00:00
        auth_session_id_hash: auth_session_id_hash
        auth_user_id_hash: auth_user_id_hash
        auth_username_hash: auth_username_hash
        auth_phone_number_hash: auth_phone_number_hash
      properties:
        metadata:
          additionalProperties: true
          description: "Your own data about the signature request, such as an ID from\
            \ your app."
          type: object
        auth_type:
          allOf:
          - $ref: "#/components/schemas/SignatureRequestAuthType"
          description: How your app authenticated the person before it showed them
            the signature request.
        auth_second_factor_type:
          allOf:
          - $ref: "#/components/schemas/SignatureRequestAuthSecondFactorType"
          description: "The second factor your app authenticated them with, if any."
        auth_provider:
          description: "The service that authenticated them, such as `google`. Required\
            \ when `auth_type` is `oauth`."
          type: string
          x-nullable: true
        auth_session_started_at:
          description: When your app authenticated them. Set for you with `email_link`.
          format: date-time
          type: string
          x-nullable: true
        auth_session_id_hash:
          description: "A hash of your app's session ID, for the audit trail."
          type: string
          x-nullable: true
        auth_user_id_hash:
          description: "Their user ID in your app, or a SHA-256 hash of a salt and\
            \ the user ID."
          type: string
          x-nullable: true
        auth_username_hash:
          description: "Their username in your app, or a SHA-256 hash of a salt and\
            \ the username."
          type: string
          x-nullable: true
        auth_phone_number_hash:
          description: "The phone number they authenticated with, or a SHA-256 hash\
            \ of a salt and the phone number."
          type: string
          x-nullable: true
      title: UpdateSignatureRequestRequest
    CreateSignatureRequestTokenRequest:
      additionalProperties: false
      description: The kind of link to make. Send no body for an `api` token.
      example:
        type: ""
      properties:
        type:
          allOf:
          - $ref: "#/components/schemas/SignatureRequestTokenType"
          description: "`api` (the default): the link opens the signature request\
            \ for 24 hours, for a form your app opens or a link it gives the person\
            \ right away. `email`: 7 days, for a link you send by email."
      title: CreateSignatureRequestTokenRequest
    CreateSignatureRequestEventRequest:
      additionalProperties: false
      description: The event to record.
      example:
        event_type: ""
        message_type: ""
        message_recipient: message_recipient
        occurred_at: 2000-01-23T04:56:07.000+00:00
      properties:
        event_type:
          allOf:
          - $ref: "#/components/schemas/SignatureRequestEventType"
          description: "`send_request`: you sent the signature request to the person\
            \ (`message_type` and `message_recipient` are required). It's the only\
            \ event the API records: DocSpring records everything that happens in\
