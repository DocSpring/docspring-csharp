    post:
      description: |
        Creates a submission: fills in a template with your data and generates a PDF. The PDF is generated in the
        background: on sync.api hosts the request waits for it (unless you pass `wait=false`), otherwise poll GET
        /submissions/{submission_id} until `state` isn't `pending`.

        Data that doesn't match the template's fields returns a 422 with an `invalid_data` error. The submission
        is still saved, with its errors, so you can find it in DocSpring: the error's `submission_id` is its ID.
      operationId: createSubmission
      parameters:
      - description: The template's ID.
        example: tpl_1234567890abcdef01
        explode: false
        in: path
        name: template_id
        required: true
        schema:
          type: string
        style: simple
      - description: "The template version to use: a published version (`1.2.0`, or\
          \ `1` for the latest 1.x.x), `latest` or `draft`. Default `latest` (the\
          \ draft when no version has been published)."
        explode: true
        in: query
        name: version
        required: false
        schema:
          type: string
          x-pattern-message: "must be a version like 1.2.3 or 1, or latest or draft"
        style: form
      - description: Wait until the files have been generated before responding. Default
          true on sync.api hosts.
        explode: true
        in: query
        name: wait
        required: false
        schema:
          type: boolean
        style: form
      - description: "A key of your own, such as a UUID, that makes it safe to send\
          \ this request again: for 24 hours, DocSpring answers a request with the\
          \ same key from the same API token with the first request's response (and\
          \ an `Idempotent-Replayed: true` header) instead of creating another submission.\
          \ Send a new key with each new submission, and the same key each time you\
          \ send the same request again, such as after a timeout, a network error\
          \ or a 5xx. The same key with a different request is a 422 `idempotency_key_reused`.\
          \ A 409 `idempotency_key_in_use` means the first request is still being\
          \ processed: send the request again in a few seconds."
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          x-pattern-message: can only contain printable ASCII characters
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              submission created:
                summary: submission created
                value:
                  data:
                    first_name: John
                    last_name: Smith
                    phone_number: "+11234567890"
                  metadata:
                    user_id: 42
                  test: true
