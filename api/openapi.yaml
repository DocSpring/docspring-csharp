openapi: 3.1.0
info:
  description: "Use DocSpring's API to programmatically fill out PDF forms, convert\
    \ HTML to PDFs, merge PDFs, or request legally binding e-signatures."
  title: DocSpring API
  version: v2
servers:
- description: US region
  url: https://sync.api.docspring.com/api/v2
- description: EU region
  url: https://sync.api-eu.docspring.com/api/v2
security:
- api_token_basic: []
paths:
  /authentication:
    get:
      description: |
        Checks whether your API token is valid by making an authenticated request. This endpoint is useful for
        verifying credentials during setup or troubleshooting issues.
      externalDocs:
        description: Learn how to authenticate with the DocSpring API
        url: https://docspring.com/docs/api-guide/authentication/
      operationId: testAuthentication
      responses:
        "200":
          content:
            application/json:
              examples:
                authentication succeeded:
                  summary: authentication succeeded
                  value:
                    authenticated: true
              schema:
                $ref: "#/components/schemas/AuthenticationCheck"
          description: authentication succeeded
        "401":
          content:
            application/json:
              examples:
                authentication failed:
                  summary: authentication failed
                  value:
                    error:
                      code: unauthorized
                      message: The Authorization header is missing. Send your API
                        token ID and secret with HTTP Basic auth (our client libraries
                        read DOCSPRING_TOKEN_ID and DOCSPRING_TOKEN_SECRET). See https://docspring.com/docs/api-guide/authentication/
                      details: []
                      request_id: req_1234567890abcdef01
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: authentication failed
      summary: Test authentication
      tags:
      - Client
  /combined_pdfs:
    get:
      description: "Returns the combined PDFs in your account, newest first, one page\
        \ at a time."
      operationId: listCombinedPdfs
      parameters:
      - description: "How many items to return (1-100, default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: integer
        style: form
      - description: "The previous page's `next_cursor`, to get the next page. It's\
          \ the ID of that page's last item, so get the next page before you delete\
          \ or change the items on this one."
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                combined PDFs:
                  summary: combined PDFs
                  value:
                    data:
                    - id: com_1234567890abcdef06
                      state: pending
                      source_pdfs:
                      - type: url
                        url: https://example.com/terms.pdf
                      metadata: {}
                      has_password: false
                      delete_custom_files: false
                      error_message: null
                      files: {}
                      actions: []
                      expired: false
                      expires_at: null
                      processed_at: null
                      created_at: 2018-10-20T08:50:00Z
                      updated_at: 2018-10-20T09:00:00Z
                    - id: com_1234567890abcdef05
                      state: processed
                      source_pdfs:
                      - type: submission
                        id: sub_1234567890abcdef01
                      - type: template
                        id: tpl_1234567890abcdef01
                        processed: false
                      metadata:
                        user_id: 42
                      has_password: true
                      delete_custom_files: false
                      error_message: null
                      files:
                        pdf:
                          state: processed
                          error_message: null
                          download_url: https://example.com/combined_pdfs/combined.pdf
                          permanent_url: https://app.docspring.com/combined_pdfs/com_1234567890abcdef05/files/pdf
                          filename: com_1234567890abcdef05.pdf
                          content_type: application/pdf
                          size: 4911
                          sha256: 0622971147486e1900037eff229d921d14f5b51aac7171729b2b66f81cdf6585
                      actions: []
                      expired: false
                      expires_at: null
                      processed_at: 2018-10-20T08:40:05Z
                      created_at: 2018-10-20T08:40:00Z
                      updated_at: 2018-10-20T09:00:00Z
                    next_cursor: null
              schema:
                $ref: "#/components/schemas/CombinedPdfList"
          description: combined PDFs
        "422":
          content:
            application/json:
              examples:
                invalid query parameters:
                  summary: invalid query parameters
                  value:
                    error:
                      code: validation_failed
                      message: "Invalid request: cursor isn't an ID in this list.\
                        \ Pass the previous page's next_cursor. A cursor stops working\
                        \ once its record is deleted or no longer matches the list's\
                        \ filters, so get the next page before you delete or change\
                        \ the records on this one"
                      details:
                      - code: not_found
                        message: "isn't an ID in this list. Pass the previous page's\
                          \ next_cursor. A cursor stops working once its record is\
                          \ deleted or no longer matches the list's filters, so get\
                          \ the next page before you delete or change the records\
                          \ on this one"
                        parameter: cursor
                      request_id: req_1234567890abcdef01
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: invalid query parameters
        "401":
          content:
            application/json:
              examples:
                authentication failed:
                  summary: authentication failed
                  value:
                    error:
                      code: unauthorized
                      message: The Authorization header is missing. Send your API
                        token ID and secret with HTTP Basic auth (our client libraries
                        read DOCSPRING_TOKEN_ID and DOCSPRING_TOKEN_SECRET). See https://docspring.com/docs/api-guide/authentication/
                      details: []
                      request_id: req_1234567890abcdef01
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: authentication failed
      summary: List combined PDFs
      tags:
      - Client
    post:
      description: |
        Merges PDFs into one: submissions, other combined PDFs, templates, custom files (POST /custom_files) and
        PDFs from URLs, in the order of `source_pdfs`. The PDF is generated in the background: on sync.api hosts the
        request waits for it (unless you pass `wait=false`), otherwise poll GET /combined_pdfs/{combined_pdf_id} until
        `state` isn't `pending`.

        A template source merges the template's processed PDF by default: the PDF submissions are filled in on,
        decrypted and with its form fields removed. Pass `processed: false` to merge the PDF as it was uploaded.
      operationId: createCombinedPdf
      parameters:
      - description: Wait until the PDF has been generated before responding. Default
          true on sync.api hosts.
        explode: true
        in: query
        name: wait
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            examples:
              combined PDF created:
                summary: combined PDF created
                value:
                  source_pdfs:
                  - type: submission
                    id: sub_1234567890abcdef01
                  - type: template
                    id: tpl_1234567890abcdef01
                  - type: url
                    url: https://example.com/terms.pdf
                  metadata:
                    user_id: 42
                  password: secret
                  expires_in: 3600
              combined PDF from a combined PDF and an original template PDF:
                summary: combined PDF from a combined PDF and an original template
                  PDF
                value:
                  source_pdfs:
                  - type: combined_pdf
                    id: com_1234567890abcdef05
                  - type: template
                    id: tpl_1234567890abcdef01
                    template_version: draft
                    processed: false
                  - type: custom_file
                    id: cfi_1234567890abcdef01
                  delete_custom_files: true
            schema:
              $ref: "#/components/schemas/CreateCombinedPdfRequest"
        description: "The PDFs to merge, and the combined PDF's settings."
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                combined PDF created:
                  summary: combined PDF created
                  value:
                    id: com_1234567890abcdef01
                    state: pending
                    source_pdfs:
                    - type: submission
                      id: sub_1234567890abcdef01
                    - type: template
                      id: tpl_1234567890abcdef01
                      processed: true
                    - type: url
                      url: https://example.com/terms.pdf
                    metadata:
                      user_id: 42
                    has_password: true
                    delete_custom_files: false
                    error_message: null
                    files: {}
                    actions: []
                    expired: false
                    expires_at: null
                    processed_at: null
                    created_at: 2018-10-20T09:00:00Z
                    updated_at: 2018-10-20T09:00:00Z
                combined PDF from a combined PDF and an original template PDF:
                  summary: combined PDF from a combined PDF and an original template
                    PDF
                  value:
                    id: com_1234567890abcdef01
                    state: pending
                    source_pdfs:
                    - type: combined_pdf
                      id: com_1234567890abcdef05
                    - type: template
                      id: tpl_1234567890abcdef01
                      template_version: draft
                      processed: false
                    - type: custom_file
                      id: cfi_1234567890abcdef01
                    metadata: {}
                    has_password: false
                    delete_custom_files: true
                    error_message: null
                    files: {}
                    actions: []
                    expired: false
                    expires_at: null
                    processed_at: null
                    created_at: 2018-10-20T09:00:00Z
                    updated_at: 2018-10-20T09:00:00Z
              schema:
                $ref: "#/components/schemas/CombinedPdf"
          description: combined PDF created
        "422":
          content:
            application/json:
              examples:
                invalid source PDFs:
                  summary: invalid source PDFs
                  value:
                    error:
                      code: validation_failed
                      message: "Invalid request: /source_pdfs/0/id isn't a submission\
                        \ in this account; /source_pdfs/4/id isn't a submission in\
                        \ this account; /source_pdfs/1/template_version isn't a published\
                        \ version of tpl_1234567890abcdef01 (and 1 more)"
                      details:
                      - code: not_found
                        message: isn't a submission in this account
                        pointer: /source_pdfs/0/id
                      - code: not_found
                        message: isn't a submission in this account
                        pointer: /source_pdfs/4/id
                      - code: not_found
                        message: isn't a published version of tpl_1234567890abcdef01
                        pointer: /source_pdfs/1/template_version
                      - code: not_found
                        message: isn't a custom file in this account
                        pointer: /source_pdfs/2/id
                      request_id: req_1234567890abcdef01
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: invalid source PDFs
        "403":
          content:
            application/json:
              examples:
                not allowed:
                  summary: not allowed
                  value:
                    error:
                      code: forbidden
                      message: "Test API tokens can't delete custom files, so delete_custom_files\
                        \ needs a live API token."
                      details: []
                      request_id: req_1234567890abcdef01
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: not allowed
        "402":
          content:
            application/json:
              examples:
                not enough credits:
                  summary: not enough credits
                  value:
                    error:
                      code: insufficient_credits
                      message: "Insufficient credits. This combined PDF will be processed\
                        \ automatically once you add credits in Billing. If it's still\
                        \ waiting after 30 days, it won't be processed."
                      details: []
                      request_id: req_1234567890abcdef01
                      combined_pdf_id: com_1234567890abcdef01
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: not enough credits
        "401":
          content:
            application/json:
              examples:
                authentication failed:
                  summary: authentication failed
                  value:
                    error:
                      code: unauthorized
                      message: The Authorization header is missing. Send your API
                        token ID and secret with HTTP Basic auth (our client libraries
                        read DOCSPRING_TOKEN_ID and DOCSPRING_TOKEN_SECRET). See https://docspring.com/docs/api-guide/authentication/
                      details: []
                      request_id: req_1234567890abcdef01
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: authentication failed
      summary: Combine PDFs
      tags:
      - Client
      x-codegen-request-body-name: body
