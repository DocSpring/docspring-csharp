          description: "The template's document, a PDF or a Word document (.docx or\
            \ .odt): the `fields.key` of a file you uploaded with the presigned upload\
            \ (GET /uploads/presign). PDF and Word templates need one of `cache_id`,\
            \ `document_url` and `document_base64`. To upload the file with the request,\
            \ use POST /templates/upload."
          type: string
        document_url:
          description: "An https:// link to the template's document, instead of `cache_id`:\
            \ a PDF template's PDF (up to 100 MB) or a Word template's Word document\
            \ (.docx or .odt, up to 50 MB). DocSpring downloads it after responding,\
            \ following redirects to other https:// links: the template's `document.state`\
            \ is `downloading` until then, and `converting` while an .odt is converted\
