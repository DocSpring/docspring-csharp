                  field_dependencies:
                  - action: show
                    match: all
                    conditions:
                    - field: first_name
                      operator: present
                    - field: last_name
                      operator: in
                      value:
                      - Smith
                    - field: last_name
                      operator: in
                      value:
                      - Jones
                    targets:
                    - phone_number
