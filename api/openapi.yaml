      additionalProperties: {}
      description: "A submission in a list: its template, state, test or live, metadata\
        \ and timestamps, with its data and files when you ask for them. Get a submission\
        \ by its ID for its signature requests, uploads and page images."
      example:
        id: id
        template_id: template_id
        template_type: ""
        template_version: template_version
        batch_id: batch_id
        source: ""
        state: ""
        test: true
