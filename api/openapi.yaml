            \ it is printed as that character, and `{{ value | raw }}` prints a value\
            \ as HTML. New HTML templates default to true. Templates created before\
            \ October 2026, or with API v1, default to false, which prints every value\
            \ as HTML. Null for PDF templates."
          type: boolean
