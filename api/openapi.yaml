          description: "What changed in the version, shown with it in DocSpring."
          type: string
      required:
      - version_type
      title: PublishTemplateVersionRequest
    RestoreTemplateVersionRequest:
      additionalProperties: false
      description: The version to restore.
      example:
        version: version
      properties:
        version:
          description: "The published version to restore to the draft (`1.2.0`, or\
            \ `1` for the latest 1.x.x)."
          type: string
          x-pattern-message: must be a published version like 1.2.3 or 1
      required:
      - version
      title: RestoreTemplateVersionRequest
    CreateWebhookRequest:
      additionalProperties: false
      description: The webhook to create.
      example:
        name: name
        url: url
        enabled: true
        event_types:
        - submission.processed
        - submission.processed
        mode: ""
        api_token_ids:
        - api_token_ids
        - api_token_ids
        template_ids:
