  /templates/{template_id}/document:
    put:
      description: |
        Replaces a PDF template's PDF, or a Word template's Word document (from a .docx or an .odt), with one you
        uploaded with the presigned upload (GET /uploads/presign) (`cache_id`), a link to download it from
        (`document_url`), or the file in base64 (`document_base64`). A PDF template's fields stay where they are,
        unless `reimport_fields` replaces them with the new PDF's fillable fields, and a Word template gets a field
        for each new tag. To send the file as `multipart/form-data` instead, use PUT
        /templates/{template_id}/document/upload.
      operationId: updateTemplateDocument
      parameters:
      - description: The template's ID.
        example: tpl_1234567890abcdef01
        explode: false
        in: path
        name: template_id
        required: true
        schema:
          type: string
        style: simple
      - description: "Wait until the PDF has been processed, a `document_url`'s PDF\
          \ or Word document downloaded, and an OpenDocument file converted, before\
          \ responding. Default true on sync.api hosts."
        explode: true
        in: query
        name: wait
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            examples:
              PDF replaced:
                summary: PDF replaced
                value:
                  cache_id: cache/original-0000000000
                  filename: fw8ben.pdf
                  reimport_fields: true
              PDF to be replaced from a URL:
                summary: PDF to be replaced from a URL
                value:
                  document_url: https://example.com/forms/fw8ben.pdf?token=abc
            schema:
              $ref: "#/components/schemas/UpdateTemplateDocumentRequest"
        description: "The new PDF, or a Word template's new Word document, as one\
          \ of `cache_id`, `document_url` and `document_base64`."
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                PDF replaced:
                  summary: PDF replaced
                  value:
                    id: tpl_1234567890abcdef01
                    name: Rental Contract
