          additionalProperties: true
          description: "Your own data about the submission, such as an ID from your\
            \ app. It isn't printed on the PDF."
          type: object
        password:
          description: A password that the PDF needs to be opened with. It's never
            returned; `has_password` says if it's set.
          type: string
          writeOnly: true
        expires_in:
          description: "Seconds after the PDF is generated until the submission expires,\
            \ up to 10 years (315360000). Default the template's expiration setting.\
