  /templates/{template_id}/model_code:
    get:
      description: |
        Generates types for a template's submission data in TypeScript, JavaScript, Ruby, Python, PHP, Java, C#,
        Elixir or Go, so your app catches mistakes before it calls the API. `root_type_name` is the type of the whole
        `data` object. Java returns every class in `code`, each under a `// ClassName.java` comment. A template with
        no named fields returns 422.
      operationId: getTemplateModelCode
      parameters:
      - description: The template's ID.
        example: tpl_1234567890abcdef01
        explode: false
        in: path
        name: template_id
        required: true
        schema:
          type: string
        style: simple
      - description: "The template version: a published version (`1.2.0`, or `1` for\
          \ the latest 1.x.x), `latest` or `draft`. Default `latest` (the draft when\
          \ no version has been published), the version a submission uses by default."
        example: draft
        explode: true
        in: query
        name: version
        required: false
        schema:
          type: string
          x-pattern-message: "must be a version like 1.2.3 or 1, or latest or draft"
        style: form
      - description: The language to generate the code in.
        example: typescript
        explode: true
        in: query
        name: lang
        required: true
        schema:
          $ref: "#/components/schemas/ModelCodeLanguage"
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                model code:
                  summary: model code
                  value:
                    lang: typescript
                    root_type_name: RentalContract
                    code: |
                      // To parse this data:
                      //
                      //   import { Convert, RentalContract } from "./rental-contract";
                      //
                      //   const rentalContract = Convert.toRentalContract(json);
                      //
                      // These functions will throw an error if the JSON doesn't
                      // match the expected interface, even if the JSON is valid.

                      /**
                       * JSON Schema generated by DocSpring.com
                       */
                      export interface RentalContract {
                          first_name:    string;
                          last_name:     string;
                          phone_number?: null | string;
                      }

                      // Converts JSON strings to/from your types
                      // and asserts the results of JSON.parse at runtime
                      export class Convert {
                          public static toRentalContract(json: string): RentalContract {
                              return cast(JSON.parse(json), r("RentalContract"));
                          }

                          public static rentalContractToJson(value: RentalContract): string {
                              return JSON.stringify(uncast(value, r("RentalContract")), null, 2);
                          }
                      }

                      function invalidValue(typ: any, val: any, key: any, parent: any = ''): never {
                          const prettyTyp = prettyTypeName(typ);
                          const parentText = parent ? ` on ${parent}` : '';
                          const keyText = key ? ` for key "${key}"` : '';
                          throw Error(`Invalid value${keyText}${parentText}. Expected ${prettyTyp} but got ${JSON.stringify(val)}`);
                      }

                      function prettyTypeName(typ: any): string {
