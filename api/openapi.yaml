    CombinedPdf:
      additionalProperties: {}
      description: "A PDF made by merging other PDFs: submissions, other combined\
        \ PDFs, templates, custom files and PDFs from URLs."
      example:
        id: id
        state: ""
        source_pdfs:
        - type: ""
          id: id
          url: url
          template_version: template_version
          processed: true
        - type: ""
          id: id
          url: url
          template_version: template_version
          processed: true
        metadata:
          key: ""
        has_password: true
        delete_custom_files: true
        error_message: error_message
        files: ""
        actions:
        - id: id
          integration_id: integration_id
          state: ""
          action_type: ""
          result_data:
            key: ""
          error_message: error_message
        - id: id
          integration_id: integration_id
          state: ""
          action_type: ""
          result_data:
            key: ""
          error_message: error_message
        expired: true
        expires_at: 2000-01-23T04:56:07.000+00:00
        processed_at: 2000-01-23T04:56:07.000+00:00
        created_at: 2000-01-23T04:56:07.000+00:00
        updated_at: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          description: The combined PDF's ID.
          type: string
        state:
          allOf:
          - $ref: "#/components/schemas/CombinedPdfState"
          description: "`pending` until the PDF has been generated, then `processed`.\
            \ `insufficient_credits`: waiting for credits; `error_message` says whether\
            \ the PDF is generated once you add them. `account_suspended`: waiting\
            \ for the account to be reactivated, for up to 30 days. `error`: the PDFs\
            \ couldn't be merged (see `error_message`). Waiting ends in `error` if\
            \ it's discarded or takes over 30 days."
          x-open-enum: true
        source_pdfs:
          description: "The PDFs to merge, in order."
          items:
            $ref: "#/components/schemas/CombinedPdfSource"
          type: array
          default: null
        metadata:
          additionalProperties: true
          description: "Your own data about the combined PDF, such as an ID from your\
            \ app. Its `pdf_filename` key names the PDF's file (`files.pdf.filename`,\
            \ and its download): a `.pdf` ending is removed, each run of characters\
            \ other than letters, digits, `-`, `_` and `.` becomes one `_`, and the\
            \ first 128 characters are kept, then `.pdf` is added. Without it, the\
            \ file is named after the combined PDF's ID (`com_1234567890abcdef01.pdf`)."
          type: object
        has_password:
          description: Whether the PDF needs a password to open (`password`).
          type: boolean
        delete_custom_files:
          description: Delete the custom files in `source_pdfs` once the combined
            PDF has been generated (they're kept if it fails). Other combined PDFs
            can't use them after that. A test API token can't delete custom files.
          type: boolean
        error_message:
          description: "Why the PDFs couldn't be merged, when `state` is `error`."
          type: string
          x-nullable: true
        files:
          allOf:
          - $ref: "#/components/schemas/CombinedPdfFiles"
          description: "The generated files, by format. Empty until the PDF has been\
            \ generated, and once it has expired."
        actions:
          description: The uploads of the PDF to your storage (account integrations).
          items:
            $ref: "#/components/schemas/SubmissionAction"
          type: array
          default: null
        expired:
          description: "An expired combined PDF's PDF, metadata, password and source\
            \ URLs have been deleted."
          type: boolean
        expires_at:
          description: When the combined PDF expires (`expires_in` after it's generated).
            Null if it's kept until you delete it.
          format: date-time
          type: string
          x-nullable: true
        processed_at:
          description: When the PDF was generated. Null until then.
          format: date-time
          type: string
          x-nullable: true
        created_at:
          description: When the combined PDF was created.
          format: date-time
          type: string
        updated_at:
          description: When the combined PDF was last updated.
          format: date-time
          type: string
      required:
      - actions
      - created_at
      - delete_custom_files
      - error_message
      - expired
      - expires_at
      - files
      - has_password
      - id
      - metadata
      - processed_at
      - source_pdfs
      - state
      - updated_at
      title: CombinedPdf
