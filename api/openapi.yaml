          description: "A machine-readable error code. Clients should handle codes\
            \ they don't know: new codes can be added. `invalid_data`: a submission's\
            \ data doesn't match its template's fields. The submission is still recorded.\
            \ `insufficient_credits` (402): your credit balance can't cover a live\
            \ PDF. The record was saved and waits for credits in the `insufficient_credits`\
            \ state: its ID is in `submission_id`, `submission_batch_id` or `combined_pdf_id`.\
            \ `upgrade_required` (403): your plan doesn't include this, such as more\
            \ templates or the embedded template editor. `account_suspended` (403):\
            \ the account is suspended, so it can't create submissions. `polling_timeout`:\
            \ on a sync.api host, the PDF wasn't ready in time. The record was created\
            \ and is still being processed: its ID is in `submission_id`, `submission_batch_id`,\
            \ `combined_pdf_id` or `template_id`. Without one of these IDs, the request\
            \ itself got no answer in time, and the record may or may not have been\
            \ created."
          x-open-enum: true
        message:
          description: "A human-readable explanation, safe to show to developers."
          type: string
        details:
          description: What was wrong with each part of the request. Empty when the
            error isn't about one part of it.
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
          default: null
        request_id:
          description: The ID of the request. Include it when you contact support.
          type: string
          x-nullable: true
        submission_id:
          description: "When a submission's data fails validation, the submission\
            \ is still recorded (state `invalid_data`) so you can see it in the dashboard.\
            \ This is its ID. With `insufficient_credits`, the submission that waits\
            \ for credits. With `polling_timeout`, the submission that's still being\
            \ processed."
          type: string
        submission_batch_id:
          description: "The ID of the recorded batch, when items in a batch fail validation.\
            \ With `insufficient_credits`, the batch whose submissions wait for credits.\
            \ With `polling_timeout`, the batch that's still being processed."
          type: string
        combined_pdf_id:
          description: "With `insufficient_credits`, the combined PDF that waits for\
            \ credits. With `polling_timeout`, the combined PDF that's still being\
            \ processed."
          type: string
        template_id:
          description: "With `polling_timeout`, the template whose PDF is still being\
            \ processed."
          type: string
