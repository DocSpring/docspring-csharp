            \ from a Word template), `odt` (an OpenDocument file, the format LibreOffice\
            \ uses, converted from a Word template's Word document), and `png` (an\
            \ image of each page of the PDF, up to 100 pages, which adds `pdf`) when\
            \ you ask for it. Default `[\"pdf\"]`, or a Word template's `output_format`.\
            \ POST /submissions/{submission_id}/generate_files adds `png`, and a Word\
            \ template's submission's `pdf`, `docx` or `odt`, to a processed submission."
          items:
            $ref: "#/components/schemas/OutputFormat"
          type: array
          uniqueItems: true
          default: null
        expires_in:
          description: "Seconds after the PDF is generated until the submission expires,\
            \ up to 10 years (315360000). Default the template's expiration setting.\
            \ A submission that isn't processed, such as one with invalid data, is\
            \ kept for at least 48 hours."
          type: integer
          writeOnly: true
        field_overrides:
          additionalProperties:
            $ref: "#/components/schemas/FieldOverride"
          description: "Changes to field settings for this submission only, by field\
            \ name, such as `{\"name\": {\"required\": false, \"font_size\": 9}}`.\
            \ A setting that identifies the field (`id`, `name`, `type`), that only\
            \ the template sets (such as `description`), or that doesn't apply to\
            \ the field's type and display type (such as `check_character` on a field\
            \ displayed as text) is a 422. With `signature_requests`, `editable: true`\
            \ is a 422, and a `default` for a signature or initials field makes the\
            \ submission `invalid_data`."
          type: object
          writeOnly: true
        html:
          description: "For an HTML template, HTML to use instead of the template's."
          type: string
          writeOnly: true
        css:
          description: "For an HTML template, SCSS (plain CSS works too) added after\
            \ the template's styles, on the page and in its header and footer. It\
            \ doesn't replace them: its rules come later, so they win over the template's\
            \ rules of the same specificity."
          type: string
          writeOnly: true
        signature_requests:
          description: "The people who sign the PDF, and fill in their fields first.\
            \ The PDF is generated once every signature request is completed. PDF\
            \ templates only. Without `role`s, the first signature request is `Signer\
            \ 1`, the second `Signer 2`, and so on. To leave a signer out, give every\
