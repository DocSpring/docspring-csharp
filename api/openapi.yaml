          description: The template's name.
          type: string
        description:
          description: The template's description.
          type: string
        parent_folder_id:
          description: "The folder to put the template in. Left out, it's created\
            \ at the root."
          type: string
        ai_field_naming_language:
          allOf:
          - $ref: "#/components/schemas/AiFieldNamingLanguage"
          description: "The language AI field setup names fields in: `auto` uses the\
            \ form's language when it's written in the Latin alphabet without accents,\
            \ and English otherwise; `english` always uses English; `form_language`\
            \ uses the form's language and script. Default: your account's template\
            \ settings."
        detect_fields:
          description: "Set up the PDF's fields as DocSpring's \"Automatically detect\
            \ fields\" upload option does: import or detect the fields, name them\
            \ with AI, and set up conditional logic. `field_source`, `field_naming`\
            \ and `field_logic` choose how. Default false. `document.page_processing_statuses`\
            \ and `document.field_logic_status` show how it's going, and `document.state`\
            \ becomes `processed` once every page's fields are set up."
          type: boolean
        field_source:
          allOf:
          - $ref: "#/components/schemas/FieldSetupSource"
          description: "With `detect_fields`, where the fields come from. `auto` (the\
            \ default) imports the form fields of a fillable PDF and detects the fields\
            \ of a PDF without them; `pdf_detection` detects the fields from the page\
            \ layout, even on a fillable PDF; `pdf_form_fields` only imports the PDF's\
            \ form fields."
        field_naming:
          allOf:
          - $ref: "#/components/schemas/FieldSetupNaming"
          description: "With `detect_fields`, how the fields are named. `ai` (the\
            \ default) names them and sets their types and settings with AI; `preserve`\
            \ keeps the names of the PDF's form fields, and AI only names the fields\
            \ it detected. `preserve` needs `field_source` `auto` or `pdf_form_fields`."
        field_logic:
          allOf:
          - $ref: "#/components/schemas/FieldSetupLogic"
          description: "With `detect_fields`, whether AI reads the whole form once\
            \ the fields are named and sets up conditional logic and required fields\
            \ (`ai`) or not (`none`). Default: your account's template settings."
        output_format:
          allOf:
          - $ref: "#/components/schemas/OutputFormat"
          description: "What each submission of a Word template makes unless its request\
            \ sets `output_formats`: `docx` (a Word document), `odt` (an OpenDocument\
            \ file, converted from the Word document) or `pdf`. Required when `document`\
            \ is a Word document."
      required:
      - document
      title: UploadTemplateRequest
    UploadTemplateDocumentRequest:
      additionalProperties: {}
      description: "The new PDF, or the new Word document of a Word template."
      properties:
        document:
          description: "The new PDF, or the new Word document (.docx or .odt) of a\
            \ Word template."
          format: binary
          type: string
        reimport_fields:
          description: "Replace all of the template's fields with the fillable fields\
            \ in the new PDF, once DocSpring has processed it (`document.field_reimport_state`).\
            \ As on a first upload, the default typeface, font size, bold and color\
            \ are taken from the PDF's fields; the template's other settings are kept.\
            \ If the PDF has no fillable fields, the template keeps its fields. A\
            \ locked template can't re-import its fields. Only for PDF templates:\
            \ a Word template adds a field for each new tag."
          type: boolean
      required:
      - document
      title: UploadTemplateDocumentRequest
