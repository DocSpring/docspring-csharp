          description: "Changes to field settings for this submission only, by field\
            \ name, such as `{\"name\": {\"required\": false, \"font_size\": 9}}`.\
            \ A setting that identifies the field (`id`, `name`, `type`), that only\
            \ the template sets (such as `description`), or that doesn't apply to\
            \ the field's type and display type (such as `check_character` on a field\
            \ displayed as text) is a 422. With `signature_requests`, `editable: true`\
            \ is a 422, and a `default` for a signature or initials field makes the\
            \ submission `invalid_data`."
          type: object
          writeOnly: true
        html:
          description: "For an HTML template, HTML to use instead of the template's."
          type: string
          writeOnly: true
        css:
          description: "For an HTML template, CSS to use instead of the template's."
          type: string
          writeOnly: true
        template_id:
          description: The submission's template. Default the batch's `template_id`.
          type: string
        template_version:
          description: The version of the submission's template. Default the batch's
            `template_version`.
          type: string
          x-pattern-message: "must be a version like 1.2.3 or 1, or latest or draft"
