    get:
      description: |
        Generates types for a template's submission data in TypeScript, JavaScript, Ruby, Python, PHP, Java, C#,
        Elixir, Go or Rust, so your app catches mistakes before it calls the API. `root_type_name` is the type of the
        whole `data` object, and `just_types=true` leaves out the code that converts JSON to and from the types. Java
        returns every class in `code`, each under a `// ClassName.java` comment. A template with no named fields
        returns 422.
      operationId: getTemplateModelCode
      parameters:
      - description: The template's ID.
        example: tpl_1234567890abcdef01
        explode: false
        in: path
        name: template_id
        required: true
        schema:
          type: string
        style: simple
      - description: "The template version: a published version (`1.2.0`, or `1` for\
          \ the latest 1.x.x), `latest` or `draft`. Default `latest` (the draft when\
          \ no version has been published), the version a submission uses by default."
        example: draft
        explode: true
        in: query
        name: version
        required: false
        schema:
          type: string
          x-pattern-message: "must be a version like 1.2.3 or 1, or latest or draft"
        style: form
      - description: The language to generate the code in.
        example: typescript
        explode: true
        in: query
        name: lang
        required: true
        schema:
          $ref: "#/components/schemas/ModelCodeLanguage"
        style: form
      - description: "Return only the types (interfaces, classes or structs), without\
          \ the code that converts JSON to and from them. Default false. JavaScript\
          \ has no types, PHP has no types-only code, and Rust's code is only types\
          \ (serde converts the JSON), so theirs is the same either way."
