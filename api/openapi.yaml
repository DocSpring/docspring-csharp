                model code:
                  summary: model code
                  value:
                    lang: typescript
                    root_type_name: RentalContract
                    code: |
                      // To parse this data:
                      //
                      //   import { Convert, RentalContract } from "./rental-contract";
                      //
                      //   const rentalContract = Convert.toRentalContract(json);
                      //
                      // These functions will throw an error if the JSON doesn't
                      // match the expected interface, even if the JSON is valid.

                      /**
                       * JSON Schema generated by DocSpring.com
                       */
                      export interface RentalContract {
                          first_name:    string;
