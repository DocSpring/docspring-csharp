          description: "The `fields.key` of the new PDF, uploaded with the presigned\
            \ upload (GET /uploads/presign)."
          type: string
        filename:
          description: "The PDF's file name, for a `cache_id` (presigned uploads don't\
            \ send one)."
          type: string
        reimport_fields:
          description: "Replace all of the template's fields with the fillable fields\
            \ in the new PDF, once DocSpring has processed it (`document.field_reimport_state`).\
            \ As on a first upload, the default typeface, font size, bold and color\
            \ are taken from the PDF's fields; the template's other settings are kept.\
            \ If the PDF has no fillable fields, the template keeps its fields. A\
            \ locked template can't re-import its fields."
          type: boolean
      required:
      - cache_id
      title: UpdateTemplateDocumentRequest
    CopyTemplateRequest:
      additionalProperties: false
      description: Settings for the copy.
      example:
        name: name
        parent_folder_id: parent_folder_id
        version: version
      properties:
        name:
          description: "Default: the template's name followed by a number, such as\
            \ \"Contract (2)\". For a published version, the name followed by the\
            \ version, such as \"Contract (v1.2.0)\"."
          type: string
        parent_folder_id:
          description: "The folder to put the copy in. Null puts it at the root. Left\
            \ out, the copy goes in the template's own folder."
          type: string
          x-nullable: true
        version:
          description: "Copy this published version (`1.2.0`, or `1` for the latest\
            \ 1.x.x) instead of the draft."
          type: string
          x-pattern-message: must be a published version like 1.2.3 or 1
      title: CopyTemplateRequest
    MoveTemplateRequest:
      additionalProperties: false
      description: Where to move the template.
      example:
        parent_folder_id: parent_folder_id
      properties:
        parent_folder_id:
          description: The folder to move the template and all of its published versions
